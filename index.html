<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>결 GYEOL · 4글자 결혼 타입 매칭</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ivory:#FAF6EF; --ivory-2:#F4EDE1; --paper:#FFFFFF;
  --ink:#152134; --ink-2:#3C4759; --muted:#7E8798; --muted-2:#A2AAB8;
  --line:#ECE4D7; --line-2:#F2EBDF;
  --navy:#16233A; --navy-2:#233553; --gold:#C6A667; --gold-soft:#EFE2C7; --gold-deep:#A98A4A;
  --rose:#C1695F; --ok:#3C7C61; --warn:#B4763C;
  --sh-1:0 2px 10px rgba(21,33,52,.05);
  --sh-2:0 10px 30px rgba(21,33,52,.10);
}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  background:#0E1726;
  background-image:radial-gradient(120% 90% at 15% 0%,#26374F 0%,#16233A 45%,#0B1220 100%);
  color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:28px 16px; gap:14px; word-break:keep-all; line-height:1.5;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
input,select{font-family:inherit;font-size:15px;color:inherit}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.stage{display:flex;align-items:center;justify-content:center;width:100%}

/* ---------- phone shell ---------- */
.phone{
  position:relative;width:430px;height:min(894px,calc(100vh - 132px));
  background:var(--ivory);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 11px #0B111C, 0 0 0 13px #33415B, 0 44px 90px -20px rgba(0,0,0,.75), 0 0 90px rgba(198,166,103,.10);
}
.statusbar{
  flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.01em;
  background:var(--ivory);position:relative;z-index:3;
}
.statusbar .sb-right{display:flex;align-items:center;gap:5px}
.statusbar svg{display:block}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:26px;border-radius:16px;background:#0B111C;z-index:4;pointer-events:none}
.screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{width:0}
.tabbar[hidden]{display:none!important}
.tabbar{
  flex:0 0 auto;display:flex;align-items:stretch;justify-content:space-around;
  padding:8px 6px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line-2);z-index:5;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--muted-2);position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:-.01em}
.tab.on{color:var(--navy)}
.tab.on::after{content:'';position:absolute;bottom:-4px;width:16px;height:3px;border-radius:2px;background:var(--gold)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--rose);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}

/* ---------- common ---------- */
.pad{padding:0 20px}
.appbar{
  position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;
  padding:6px 20px 12px;background:linear-gradient(to bottom,var(--ivory) 72%,rgba(250,246,239,.86));
  backdrop-filter:blur(6px);
}
.appbar h1{font-size:20px;font-weight:800;letter-spacing:-.03em}
.appbar .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-1);color:var(--ink-2);flex:0 0 auto}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brandmark{display:flex;align-items:baseline;gap:5px;font-weight:800;letter-spacing:-.02em}
.brandmark b{font-size:19px;color:var(--navy)}
.brandmark i{font-style:normal;font-size:9.5px;letter-spacing:.24em;color:var(--gold-deep);font-weight:700}
.card{background:var(--paper);border-radius:22px;box-shadow:var(--sh-1);border:1px solid rgba(236,228,215,.9)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:52px;border-radius:16px;font-size:15px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#fff;
  box-shadow:0 8px 20px -8px rgba(22,35,58,.55);transition:transform .12s ease,opacity .12s;
}
.btn:active{transform:scale(.985)}
.btn.gold{background:linear-gradient(180deg,#D9BC80,var(--gold-deep));box-shadow:0 8px 20px -8px rgba(169,138,74,.6)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.btn.sm{height:42px;border-radius:13px;font-size:13.5px;font-weight:700}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.linkbtn{font-size:12.5px;font-weight:700;color:var(--gold-deep);display:inline-flex;align-items:center;gap:2px}
.mbadge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--navy);color:#F6EFE2;font-size:11px;font-weight:800;letter-spacing:.06em}
.mbadge.soft{background:var(--gold-soft);color:var(--gold-deep)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;background:var(--ivory-2);color:var(--ink-2);font-size:11.5px;font-weight:600}
.tag.gold{background:#FBF3E2;color:var(--gold-deep)}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-head h2{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.sec-head .more{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:3px}
.sec-head .more svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.mono{font-variant-numeric:tabular-nums}

/* avatar */
.av{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;letter-spacing:-.02em;flex:0 0 auto;position:relative;overflow:hidden}
.av::after{content:'';position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.30),rgba(255,255,255,0) 55%)}
.av.a1{background:linear-gradient(145deg,#E4BE8C,#B97B5C)}
.av.a2{background:linear-gradient(145deg,#9FB2C9,#4E647F)}
.av.a3{background:linear-gradient(145deg,#E7B9AE,#B86A62)}
.av.a4{background:linear-gradient(145deg,#A9C6B4,#5B8471)}
.av.a5{background:linear-gradient(145deg,#D8C4A4,#8E7A5C)}
.av.a6{background:linear-gradient(145deg,#BFB6D6,#6F6591)}
.av.a7{background:linear-gradient(145deg,#F0CFA4,#C49356)}
.av.a8{background:linear-gradient(145deg,#A7BFC9,#5A7885)}
.av.lg{width:76px;height:76px;border-radius:26px;font-size:28px}
.av.xs{width:42px;height:42px;border-radius:14px;font-size:15px}

/* score ring */
.score{--s:90;width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--s)*1%),#EFE7D8 0);position:relative}
.score>span{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:-.03em}
.score.big{--s:96;width:64px;height:64px}
.score.big>span{width:52px;height:52px;font-size:16px}
.compat-label{font-size:9.5px;color:var(--gold-deep);font-weight:700;text-align:center;margin-top:3px;white-space:nowrap}

/* ---------- landing ---------- */
.landing{padding:18px 24px 26px;min-height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.landing .glow{position:absolute;width:340px;height:340px;border-radius:50%;top:-120px;right:-140px;background:radial-gradient(circle,rgba(198,166,103,.28),rgba(198,166,103,0) 68%)}
.landing .glow2{position:absolute;width:300px;height:300px;border-radius:50%;bottom:-140px;left:-130px;background:radial-gradient(circle,rgba(22,35,58,.10),rgba(22,35,58,0) 70%)}
.landing-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.proto-pill{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--gold-deep);background:#FBF3E2;border:1px solid #F0E3C7;padding:4px 8px;border-radius:20px}
.hero{position:relative;z-index:1;margin-top:36px}
.hero .kicker{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold-deep);margin-bottom:14px}
.hero h1{font-size:30px;line-height:1.34;font-weight:800;letter-spacing:-.045em;color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--gold-deep)}
.hero p{margin-top:14px;font-size:13px;line-height:1.65;color:var(--muted);letter-spacing:-.01em}
.hero-visual{position:relative;z-index:1;margin-top:24px;display:flex;gap:8px}
.ringcard{flex:1;background:#fff;border-radius:18px;padding:13px 12px;border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.ringcard .rc-top{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--muted)}
.ringcard .rc-top svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.ringcard .rc-code{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.01em;margin-top:4px;display:flex;align-items:baseline;gap:4px}
.ringcard .rc-code b{color:var(--gold-deep);font-size:17px}
.ringcard .rc-bar{height:4px;border-radius:3px;background:var(--ivory-2);margin-top:9px;overflow:hidden}
.ringcard .rc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.features{position:relative;z-index:1;margin-top:24px;display:flex;flex-direction:column;gap:11px}
.feat{display:flex;align-items:flex-start;gap:11px}
.feat .fi{width:30px;height:30px;border-radius:10px;background:#fff;box-shadow:var(--sh-1);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.feat b{display:block;font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.feat span{font-size:11.5px;color:var(--muted)}
.landing-bottom{position:relative;z-index:1;margin-top:auto;padding-top:24px}
.landing-note{text-align:center;font-size:10.5px;color:var(--muted-2);margin-top:11px}

/* ---------- type picker ---------- */
.picker-head{padding:4px 22px 0}
.step-row{display:flex;align-items:center;gap:7px;margin-bottom:16px}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--line)}
.step-dot.on{background:var(--gold)}
.picker-head h1{font-size:23px;font-weight:800;letter-spacing:-.04em;color:var(--navy);line-height:1.35}
.picker-head p{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.6}
.livecard{
  margin:16px 20px 0;background:linear-gradient(150deg,#1B2B45,#101B2C);border-radius:22px;padding:16px 18px;
  color:#F4EEE2;box-shadow:0 18px 36px -18px rgba(16,27,44,.7);position:relative;overflow:hidden;
}
.livecard::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,rgba(198,166,103,.35),transparent 70%)}
.livecard .lc-label{font-size:9.5px;letter-spacing:.16em;font-weight:700;color:rgba(198,166,103,.95)}
.livecard .lc-code{font-size:32px;font-weight:800;letter-spacing:.12em;margin-top:6px;display:flex;gap:4px}
.livecard .lc-code span{opacity:.3;transition:opacity .18s}
.livecard .lc-code span.on{opacity:1;color:#F6EBD6}
.livecard .lc-nick{font-size:12.5px;color:rgba(244,238,226,.78);margin-top:5px;min-height:19px;font-weight:700}
.livecard .lc-one{font-size:10.5px;color:rgba(244,238,226,.5);margin-top:3px;min-height:15px}
.qblock{padding:0 20px;margin-top:20px}
.qhead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.qnum{font-size:10px;font-weight:800;color:var(--gold-deep);letter-spacing:.12em;flex:0 0 auto}
.qtxt{font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.optline{display:flex;flex-direction:column;gap:7px}
.optcard{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:15px;background:#fff;border:1px solid var(--line);text-align:left;transition:all .15s}
.optcard.on{background:linear-gradient(140deg,#1D2D48,#152238);border-color:#152238;color:#F5EFE3;box-shadow:0 14px 26px -18px rgba(21,34,56,.9)}
.optcard .ol{width:28px;height:28px;border-radius:9px;background:var(--ivory-2);color:var(--navy);font-size:13px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.optcard.on .ol{background:rgba(227,198,142,.94);color:#16233A}
.optcard .ot2{flex:1;min-width:0}
.optcard .otitle{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.optcard .odesc{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.optcard.on .otitle{color:#F6EBD6}
.optcard.on .odesc{color:rgba(245,239,227,.66)}
.optcard .ock{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:transparent;flex:0 0 auto;margin-top:3px}
.optcard.on .ock{background:rgba(227,198,142,.94);border-color:transparent;color:#16233A}
.grid-head{display:flex;align-items:center;justify-content:space-between;margin:26px 24px 10px}
.grid-head b{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.grid-head span{font-size:11px;color:var(--muted-2)}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 20px}
.tcell{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;transition:all .14s;color:var(--ink-2)}
.tcell b{display:block;font-size:11px;font-weight:800;letter-spacing:.04em}
.tcell small{display:block;font-size:9px;color:var(--muted-2);margin-top:2px;letter-spacing:-.03em}
.tcell.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep)}
.tcell.on small{color:var(--gold-deep)}
.picker-cta{position:sticky;bottom:0;padding:14px 20px 16px;background:linear-gradient(to top,var(--ivory) 62%,rgba(250,246,239,.2))}

/* ---------- recommend ---------- */
.mytype-mini{margin:0 20px;padding:15px 16px;border-radius:20px;background:linear-gradient(140deg,#1B2B45,#131F33);color:#F5EFE3;position:relative;overflow:hidden;box-shadow:0 16px 32px -20px rgba(16,27,44,.8)}
.mytype-mini::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;right:-60px;bottom:-90px;background:radial-gradient(circle,rgba(198,166,103,.30),transparent 70%)}
.mtm-top{display:flex;align-items:center;gap:8px}
.mtm-top .mtm-code{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:#F6EBD6;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:7px}
.mtm-top .mtm-nick{font-size:11.5px;color:rgba(245,239,227,.65)}
.mtm-title{font-size:17px;font-weight:800;letter-spacing:-.03em;margin-top:10px;line-height:1.4;position:relative;z-index:1}
.mtm-title em{font-style:normal;color:#E3C68E}
.mtm-one{font-size:11.5px;color:rgba(245,239,227,.66);margin-top:6px;position:relative;z-index:1}
.mtm-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px;position:relative;z-index:1}
.mtm-foot .linkbtn{color:#E3C68E}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:33px;padding:0 13px;border-radius:11px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.top3{margin:0 20px;display:flex;flex-direction:column;gap:9px}
.t3row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line-2);border-radius:18px;padding:13px 14px;box-shadow:var(--sh-1)}
.t3rank{width:22px;height:22px;border-radius:8px;background:var(--gold-soft);color:var(--gold-deep);font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.t3body{flex:1;min-width:0}
.t3name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.t3name small{font-weight:700;font-size:10.5px;color:var(--muted)}
.t3why{font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard{margin:0 20px 10px;display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line-2);border-radius:20px;padding:14px 15px;box-shadow:var(--sh-1);transition:transform .12s ease}
.pcard:active{transform:scale(.99)}
.pbody{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.pname .age{font-size:12px;font-weight:700;color:var(--muted)}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;max-height:46px;overflow:hidden}
.ptags .tag{height:20px;font-size:10.5px;padding:0 7px;border-radius:6px}

/* ---------- my type ---------- */
.typehero{margin:0 20px;border-radius:24px;padding:22px 20px;background:linear-gradient(155deg,#1B2B45 0%,#111D2F 100%);color:#F5EFE3;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px rgba(16,27,44,.9)}
.typehero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;top:-110px;right:-90px;background:radial-gradient(circle,rgba(198,166,103,.32),transparent 70%)}
.typehero .th-code{font-size:40px;font-weight:800;letter-spacing:.14em;color:#F8F1E4;line-height:1}
.typehero .th-nick{font-size:12.5px;color:rgba(245,239,227,.6);margin-top:9px;letter-spacing:.02em}
.typehero .th-title{margin-top:16px;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.45;position:relative;z-index:1}
.typehero .th-title em{font-style:normal;color:#E3C68E}
.typehero .th-desc{margin-top:10px;font-size:12.5px;line-height:1.7;color:rgba(245,239,227,.72);position:relative;z-index:1}
.typehero .th-axes{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.typehero .th-axes span{font-size:10px;font-weight:700;color:rgba(245,239,227,.72);background:rgba(255,255,255,.1);padding:4px 8px;border-radius:7px}
.report{margin:14px 20px 0;padding:18px 17px;background:#fff;border-radius:20px;border:1px solid var(--line-2);box-shadow:var(--sh-1)}
.report h3{font-size:13px;font-weight:800;letter-spacing:-.02em;color:var(--navy);margin-bottom:14px}
.axisbar-row+.axisbar-row{margin-top:14px}
.axisbar-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted-2);margin-bottom:6px}
.axisbar-head .on{color:var(--navy)}
.axisbar{position:relative;height:7px;border-radius:5px;background:var(--ivory-2)}
.axisbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#D9BE8B,var(--gold))}
.axisbar b{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--navy);transform:translate(-50%,-50%)}

  CPLS:['WFHV','WFHS','WPLV'], CPLV:['WPHS','WPLS','WFHS'],
  CFHS:['WPLS','WPLV','WFHV'], CFHV:['WFLS','CFLV','WFHV'],
  CFLS:['WPHV','WFLV','CPHV'], CFLV:['WPHV','CPLV','WFHV']
};
function compat(a,b){
  if(!a||!b) return {score:0,reasons:[]};
  let s=60;
  const A=a.split(''),B=b.split('');
  s += A[0]===B[0]?4:9;   // 다정/담백
  s += A[1]===B[1]?14:5;  // 계획/유연 (가계관 일치가 중요)
  s += A[2]===B[2]?6:10;  // 갈등 해결
  s += A[3]===B[3]?5:9;   // 생활 리듬
  s = Math.min(99,s);
  return {score:s,reasons:makeReasons(A,B)};
}
function makeReasons(A,B){
  const dims=[['PF',1],['WC',0],['SV',3],['HL',2]], out=[];
  dims.forEach(([k,i])=>{ if(A[i]!==B[i]) out.push(PHRASE[k].diff); });
  dims.forEach(([k,i])=>{ if(A[i]===B[i]&&out.length<3) out.push(PHRASE[k].same); });
  return out.slice(0,3);
}
function top3(code){
  const best=BEST[code]||[];
  return ORDER.filter(t=>t!==code).map(t=>({type:t,...compat(code,t),f:(best.indexOf(t)>=0?1:0)}))
    .sort((a,b)=>(b.score-a.score)||(b.f-a.f)).slice(0,3);
}
function compatLabel(s){ return s>=95?'환상의 궁합': s>=88?'잘 맞는 궁합': s>=80?'편안한 궁합':'무난한 궁합'; }

function axisLeftPct(code,i){
  const base=[66,64,62,63][i];
  const h=(code.charCodeAt(0)+code.charCodeAt(i)*3+i*7)%11;
  const v=base+h-5;
  return code[i]===AXES[i].a? v : 100-v;
}

    foot='<button class="btn gold" data-act="pay-confirm" data-id="'+(top.id||'')+'" '+(ag?'':'disabled')+' style="margin-bottom:8px">'+(ag?'10,000원 결제하기':'약관에 동의해 주세요')+'</button>'+
      '<button class="btn ghost" data-act="close-sheet">다음에 할게요</button>';
  } else if(top.t==='paysuccess'){
    const p=top.id?P(top.id):null;
    body='<div class="result"><div class="ric">✓</div><h3>결제가 완료되었어요</h3>'+
      '<p>이제 이번 달 최대 6명과 대화할 수 있습니다.</p>'+
      '<div class="rcard"><div class="rr"><span>결제 상품</span><b>채팅 패스 1개월</b></div>'+
        '<div class="rr"><span>결제 금액</span><b>10,000원</b></div>'+
        '<div class="rr"><span>결제 수단</span><b>'+methodName(S.pay.method)+'</b></div>'+
        '<div class="rr"><span>다음 결제일</span><b>'+nextMonth()+'</b></div>'+
        '<div class="rr"><span>대화 슬롯</span><b>1 / 6명 사용</b></div></div>'+
      (p?'<p style="margin-top:12px">'+p.name+' 님과의 대화방으로 이동합니다.</p>':'')+
      '</div>';
    foot=(p?'<button class="btn" data-act="go-room" data-id="'+p.id+'">'+p.name+' 님과 대화 시작</button>':'<button class="btn" data-act="go-chat">채팅 탭으로 이동</button>')+
      '<button class="btn ghost" data-act="close-sheet" style="margin-top:8px">닫기</button>';
  } else if(top.t==='proconfirm'){
    const p=P(top.id), c=compat(S.myType,p.code), ag=S.pro.agree;
    body='<div class="paytop"><div class="payicon gold">🤝</div><div class="paytop-t"><b>전문 매칭 신청</b><span>전담 매니저 1:1 매칭 프로그램</span></div>'+
        '<div class="payprice">30,000<small>원</small></div></div>'+
      '<div class="matchbrief">'+av(p,'xs')+
        '<div><div style="font-size:13.5px;font-weight:800;color:var(--navy)">'+p.name+' · '+p.code+'</div>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+p.age+'세 · '+p.job+' · 궁합 '+c.score+'점</div></div></div>'+
      '<div class="orderbox">'+
        '<div class="ob-row"><span>상품</span><b>전문 매칭 신청 (스탠다드)</b></div>'+
        '<div class="ob-row"><span>포함</span><b>전담 매니저 배정 · 상대 검증 · 일정 조율</b></div>'+
        '<div class="ob-row"><span>진행</span><b>신청 후 5~7일 내 상담 연락</b></div>'+
        '<div class="ob-row total"><span>신청 금액</span><b>30,000원</b></div>'+
      '</div>'+
      '<div class="procinfo">'+
        '<div class="pi"><i>1</i><span><b>담당 매니저 배정</b>전담 매니저가 배정되어 카카오톡으로 연락드려요.</span></div>'+
        '<div class="pi"><i>2</i><span><b>프로필 검증</b>직업·학력·혼인 상태를 서류로 확인합니다.</span></div>'+
        '<div class="pi"><i>3</i><span><b>일정 조율과 만남 주선</b>양쪽 일정을 맞춰 장소와 시간을 주선합니다.</span></div>'+
      '</div>'+
      '<div class="paysec">결제 수단</div>'+pmBlock(S.pro.method,'pro')+
      '<div class="paysec">약관 동의</div>'+agreeBlock(ag,'pro-agree')+
      '<div class="proto-note"><span>ℹ️</span><span>프로토타입용 가상 결제 화면입니다. 실제 결제·매칭은 진행되지 않습니다.</span></div>';
    foot='<button class="btn" data-act="pro-confirm" data-id="'+p.id+'" '+(ag?'':'disabled')+' style="margin-bottom:8px">'+(ag?'30,000원 결제하고 신청하기':'약관에 동의해 주세요')+'</button>'+
      '<button class="btn ghost" data-act="close-sheet">취소</button>';
  } else if(top.t==='prosuccess'){
    const p=P(top.id);
    body='<div class="result"><div class="ric gold">🤝</div><h3>전문 매칭 신청 완료</h3>'+
      '<p>신청이 접수되었습니다.<br>담당 매니저 배정 중이며, 순차적으로 연락드립니다.</p>'+
      '<div class="rcard"><div class="rr"><span>요청 상대</span><b>'+p.name+' · '+p.code+'</b></div>'+
        '<div class="rr"><span>결제 금액</span><b>30,000원</b></div>'+
        '<div class="rr"><span>결제 수단</span><b>'+methodName(S.pro.method)+'</b></div>'+
        '<div class="rr"><span>요청 상태</span><b style="color:var(--gold-deep)">매니저 배정 중</b></div>'+
        '<div class="rr"><span>신청일</span><b>'+S.requests[p.id].at+'</b></div>'+
        '<div class="rr"><span>예상 연락</span><b>5~7일 이내</b></div></div></div>';
    foot='<button class="btn" data-act="go-match">매칭현황에서 확인</button>'+
      '<button class="btn ghost" data-act="close-sheet" style="margin-top:8px">닫기</button>';
  } else if(top.t==='filter'){
    body='<h3 style="font-size:17px;font-weight:800;letter-spacing:-.03em;color:var(--navy);margin-top:4px">결혼 타입으로 찾기</h3>'+
      '<p style="font-size:11.5px;color:var(--muted);margin-top:5px">상대의 4글자 코드를 고르면 그 타입만 보여드려요.</p>'+
      '<div class="filtergrid">'+
        '<button class="fcell '+(S.filter.code==='ALL'?'on':'')+'" data-act="set-filter-code" data-code="ALL">전체</button>'+
        ORDER.map(t=>{
          const n=PROFILES.filter(p=>p.code===t).length;
          return '<button class="fcell '+(n?'':'dis ')+(S.filter.code===t?'on':'')+'" '+(n?'':'disabled')+' data-act="set-filter-code" data-code="'+t+'">'+t+'</button>';
        }).join('')+
      '</div>';
  }
  layer.innerHTML='<div class="scrim" data-act="scrim"></div>'+
    '<div class="sheet"><div class="grab"><i></i></div>'+
    '<div class="sheetbody">'+body+'</div>'+(foot?'<div class="sheetfoot">'+foot+'</div>':'')+'</div>';
}

/* ============ 렌더 ============ */
function render(keepScroll){
  const screen=$('#screen'), tabbar=$('#tabbar');
  const prevTop = keepScroll? screen.scrollTop : 0;
  screen.classList.toggle('roomview', S.view==='room');
  if(S.view==='landing') screen.innerHTML=landingView();
  else if(S.view==='picker') screen.innerHTML=pickerView();
  else if(S.view==='room') screen.innerHTML=roomView();
  else screen.innerHTML = S.tab==='recommend'?recView(): S.tab==='mytype'?myTypeView(): S.tab==='chat'?chatView(): matchView();
  tabbar.hidden = S.view!=='tabs';
  if(S.view==='tabs'){
    const unread=Object.values(S.chats).reduce((a,c)=>a+(c.unread||0),0);
    const reqN=Object.keys(S.requests).length;
    tabbar.innerHTML=[
      ['recommend','추천',ICONS.star,''],
      ['mytype','내 타입',ICONS.user,''],
      ['chat','채팅',ICONS.chat,unread?'<span class="dot">'+unread+'</span>':''],
      ['match','매칭현황',ICONS.rings,reqN?'<span class="dot">'+reqN+'</span>':'']
    ].map(([k,l,ic,d])=>'<button class="tab '+(S.tab===k?'on':'')+'" data-act="tab" data-tab="'+k+'">'+ic+'<span>'+l+'</span>'+d+'</button>').join('');
  }
  sheetRender();
  if(keepScroll) screen.scrollTop=prevTop;
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1900);
}
function setView(v,tab){
  S.view=v; if(tab) S.tab=tab;
  render(); $('#screen').scrollTop=0;
  if(v==='room') scrollMsgs();
}
function scrollMsgs(){
  const mb=document.querySelector('.msgs');
  if(mb) mb.scrollTop=mb.scrollHeight;
}

/* ============ 동작 ============ */
function startWithType(){
  S.myType=S.draft.join('');
  S.view='tabs'; S.tab='recommend'; render(); $('#screen').scrollTop=0;
  toast(S.myType+' · '+TYPES[S.myType].nick);
}
function openProfile(id){
  S.sheetStack.push({t:'profile',id:String(id)}); sheetRender();
}
function startChat(id){
  id=String(id);
  if(S.chats[id]){ S.room=id; S.chats[id].unread=0; S.sheetStack=[]; setView('room'); return; }
  const n=Object.keys(S.chats).length;
  if(n>=6){ toast('대화 가능 인원이 가득 찼어요 (6/6)'); return; }
  const p=P(id);
  S.chats[id]={msgs:[{who:'them',text:'안녕하세요, '+p.name+'입니다 :) 매칭되어 반가워요. 프로필 잘 봤습니다.',at:nowTime()}],unread:0};
  S.room=id; S.sheetStack=[]; setView('room');
  toast('대화 슬롯 1개를 사용했어요 ('+(n+1)+'/6명)');
}
function doPay(id){
  const btn=document.querySelector('[data-act="pay-confirm"]');
  if(btn){ btn.disabled=true; btn.innerHTML='결제 처리 중 <span class="loadingdots"><i></i><i></i><i></i></span>'; }
  setTimeout(()=>{
    S.sub=true; S.subStart=new Date();
    S.sheetStack=[{t:'paysuccess',id:id?String(id):''}];
    sheetRender();
    toast('결제가 완료되었습니다');
    clearTimeout(doPay._t);
    if(id) doPay._t=setTimeout(()=>{
      if(S.sheetStack.length===1 && S.sheetStack[0].t==='paysuccess') startChat(id);
    },2000);
  },1200);
}
function doPro(id){
  id=String(id);
  const btn=document.querySelector('[data-act="pro-confirm"]');
  if(btn){ btn.disabled=true; btn.innerHTML='신청 처리 중 <span class="loadingdots"><i></i><i></i><i></i></span>'; }
  setTimeout(()=>{
    const managers=['김하나 매니저','이준호 매니저','박소윤 매니저'];
    S.requests[id]={at:today(),stage:1,manager:managers[Object.keys(S.requests).length%3]};
    S.sheetStack=[{t:'prosuccess',id:id}];
    sheetRender();
    toast('전문 매칭 신청이 접수되었습니다');
  },1000);
}
function sendMsg(text){
  const id=S.room, c=S.chats[id];
  if(!text.trim()||!c) return;
  c.msgs.push({who:'me',text:text.trim(),at:nowTime()});
  render(true);
  scrollMsgs();
  const replies=['네, 반가워요 :) 어떤 부분이 가장 궁금하세요?','좋아요! 저도 비슷하게 생각하고 있었어요.','주말에 시간 괜찮으세요? 편하실 때 이야기해요.','그렇게 말씀해 주시니 마음이 편하네요. 천천히 알아가요 :)'];
  const p=P(id);
  const n=c.msgs.filter(m=>m.who==='them').length;
  setTimeout(()=>{
    const box=document.querySelector('.msgs');
    if(box){
      const typing=document.createElement('div');
      typing.className='typing'; typing.textContent=p.name+' 님이 입력 중…';
      box.appendChild(typing);
      scrollMsgs();
    }
    setTimeout(()=>{
      c.msgs.push({who:'them',text:replies[n%replies.length],at:nowTime()});
      if(S.room===id){ render(true); scrollMsgs(); }
      else { c.unread=(c.unread||0)+1; render(true); }
    },1000);
  },450);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case 'go-picker': S.view='picker'; S.draft=[null,null,null,null]; render(); $('#screen').scrollTop=0; break;
    case 'letter': S.draft[+el.dataset.i]=el.dataset.l; render(true); break;
    case 'pick-type': S.draft=el.dataset.t.split(''); render(true); break;
    case 'start-with-type': if(S.draft.every(Boolean)) startWithType(); break;
    case 'tab': S.tab=el.dataset.tab; S.view='tabs'; S.room=null; render(); $('#screen').scrollTop=0; break;
    case 'open-profile': openProfile(id); break;
    case 'close-sheet': S.sheetStack=[]; sheetRender(); break;
    case 'scrim': S.sheetStack=[]; sheetRender(); break;
    case 'choose-chat':
      if(!S.sub){ S.sheetStack.push({t:'pay',id:String(id)}); sheetRender(); }
      else startChat(id);
      break;
    case 'choose-pro':
      if(S.requests[id]){ S.sheetStack=[]; S.tab='match'; S.view='tabs'; render(); $('#screen').scrollTop=0; toast('이미 신청한 상대예요 · 매칭현황에서 확인하세요'); }
      else { S.sheetStack.push({t:'proconfirm',id:String(id)}); sheetRender(); }
      break;
    case 'pay-confirm': doPay(id); break;
    case 'pro-confirm': doPro(id); break;
    case 'pay-method': S.pay.method=el.dataset.m; sheetRender(); break;
    case 'pay-agree': S.pay.agree=!S.pay.agree; sheetRender(); break;
    case 'pro-method': S.pro.method=el.dataset.m; sheetRender(); break;
    case 'pro-agree': S.pro.agree=!S.pro.agree; sheetRender(); break;
    case 'open-pay': S.sheetStack.push({t:'pay',id:''}); sheetRender(); break;
    case 'go-room': S.sheetStack=[]; startChat(id); break;
    case 'go-chat': S.sheetStack=[]; S.tab='chat'; S.view='tabs'; render(); $('#screen').scrollTop=0; break;
    case 'go-match': S.sheetStack=[]; S.tab='match'; S.view='tabs'; render(); $('#screen').scrollTop=0; break;
    case 'open-room': S.room=String(id); S.chats[id].unread=0; S.sheetStack=[]; setView('room'); break;
    case 'leave-room': S.room=null; S.tab='chat'; S.view='tabs'; render(); $('#screen').scrollTop=0; break;
    case 'filter': S.filter.min=+el.dataset.min; S.filter.code=el.dataset.code; render(true); break;
    case 'filter-open': S.sheetStack.push({t:'filter'}); sheetRender(); break;
    case 'set-filter-code': S.filter.code=el.dataset.code; S.sheetStack=[]; render(true); break;
    case 'restart': S.view='picker'; S.draft=[null,null,null,null]; render(); $('#screen').scrollTop=0; break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.dataset.form==='chat'){
    e.preventDefault();
    const input=e.target.querySelector('input');
    sendMsg(input.value);
    input.value='';
  }
});
function clock(){ const d=new Date(); let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0'); h=h%12||12; $('#clock').textContent=h+':'+m; }
clock(); setInterval(clock,30000);
render();

</script>
</body>
</html>
